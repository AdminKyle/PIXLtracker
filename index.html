<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PIXL Tracker" />
  
  <title>PIXL Tracker</title>
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Offline Indicator -->
  <div id="offline-indicator" class="offline-banner hidden">Device Offline - Scans Disabled</div>

  <!-- PWA Install Banner -->
  <div id="install-banner" class="install-banner hidden">
    <div class="install-content">
      <div class="install-icon"></div>
      <div class="install-text">
        <strong>Install PIXL Tracker</strong>
        <span>Add to home screen for offline access</span>
      </div>
    </div>
    <div class="install-actions">
      <button id="install-dismiss" class="btn-text">Later</button>
      <button id="install-btn" class="btn-primary-small">Install</button>
    </div>
  </div>

  <!-- Login View -->
  <div id="view-login" class="view active">
    <div class="login-container">
      <h1 class="logo">PIXL Tracker</h1>
      <p class="subtitle">Operations Login</p>
      
      <form id="login-form">
        <div class="input-group">
          <input type="text" id="login-user" placeholder="Username" autocomplete="username" required />
        </div>
        <div class="input-group">
          <input type="password" id="login-pin" placeholder="PIN" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" required />
        </div>
        <button type="submit" id="login-btn" class="btn-primary">
          <span class="btn-text">Login</span>
          <span class="loader hidden"></span>
        </button>
      </form>
      <div id="login-error" class="error-msg hidden">Invalid credentials</div>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="view-dashboard" class="view hidden">
    <header class="dashboard-header">
      <div class="header-left">
        <h2 id="greeting-text">Hello, User</h2>
        <span class="status-indicator">
          <span class="dot pulse"></span>
          Ready to scan
        </span>
      </div>
      <button id="logout-btn" class="btn-icon" aria-label="Logout">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </header>

    <main class="dashboard-main">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Session Scans</span>
          <span id="session-count" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Assigned Stock</span>
          <span id="assigned-stock" class="stat-value">-</span>
        </div>
      </div>

      <div class="scan-action-container">
        <button id="main-scan-btn" class="btn-scan-large">
          <div class="scan-btn-inner">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="7" y1="12" x2="17" y2="12"></line></svg>
            <span>TAP TO SCAN</span>
          </div>
        </button>
      </div>

      <div id="latest-scan-feedback" class="feedback-card hidden">
        <!-- populated dynamically -->
      </div>
    </main>
  </div>

  <!-- Scanner Fullscreen Overlay -->
  <div id="view-scanner" class="view hidden">
    <div class="scanner-header">
      <button id="close-scanner-btn" class="btn-text-close">Cancel</button>
      <span class="scanner-title">Align Barcode</span>
      <div style="width: 60px;"></div> <!-- spacer -->
    </div>
    
    <div class="video-container">
      <video id="scanner-video" playsinline></video>
      
      <!-- Processing Overlay -->
      <div id="scanner-processing" class="processing-overlay hidden">
        <div class="loader-large"></div>
        <span>Verifying...</span>
      </div>

      <div class="scanner-overlay">
        <div class="scan-region-window">
          <div class="corner top-left"></div>
          <div class="corner top-right"></div>
          <div class="corner bottom-left"></div>
          <div class="corner bottom-right"></div>
          <div class="scan-laser"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
